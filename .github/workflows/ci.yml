name: AcreMap CI

on:
  push:
    branches: [Principal]
  pull_request:
    branches: [Principal]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
      - name: Check TypeScript
        run: npm run check
